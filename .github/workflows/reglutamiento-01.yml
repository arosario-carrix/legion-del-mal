name: reglutamiento de agente

on: push

jobs:
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest

        steps:
            - name: El agente se presenta
              run: echo "Hola, soy el agente reclutado"
            - name: Confirmación de reclutamiento
              run: echo "El agente ha sido reclutado exitosamente"
            - name: Registro de reclutamiento
              run: |
                echo "Registro de reclutamiento completado"
                echo "Fin del proceso de reclutamiento"
                echo "nombre clave:" ${{github.actor}}"
                echo ""
                echo "Contexto de Github"                
                echo "Repositorio:" ${{github.repository}}"
                echo "Evento:" ${{github.event_name}}"
                echo "Actor:" ${{github.actor}}"
                echo "Ref:" ${{toJson(github)}}"
            - name: Capacidad del agente
              run: |
                echo "Capacidades detectadas:"
                echo "Sistema operativo"
                uname -a
                echo "Habilidades técnicas detectadas:"
                node --version
                git --version
                python --version

            - name: Finalización del reclutamiento
              run: echo "El proceso de reclutamiento ha finalizado"
